version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=LocalTrade_DB
      - PHP_SESSION_SAVE_PATH=/var/www/html/sessions
    volumes:
      - ./public:/var/www/html/public
      - ./api:/var/www/html/api
      - ./uploads:/var/www/html/uploads
      - ./sessions:/var/www/html/sessions
    depends_on:
      - db
  
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: LocalTrade_DB
    volumes:
      - ./database/database.sql:/docker-entrypoint-initdb.d/database.sql
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  db_data:

