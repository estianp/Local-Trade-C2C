<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details - LocalTrade</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">LocalTrade</a></div>
        <nav class="nav-menu">
            <a href="browse.html" class="nav-link">Buy</a>
            <a href="sell.html" class="nav-link" id="sellLink" style="display: none;">Sell</a>
        </nav>
        <div class="auth-buttons">
            <div id="signupBtn">
                <a href="signup.html" class="btn btn-register">Sign Up</a>
            </div>
            <div id="userProfile" style="display: none; display: flex; align-items: center; gap: 15px;">
                <span id="username"></span>
                <button id="signoutBtn" class="btn btn-login">Sign Out</button>
            </div>
        </div>
    </header>

    <section class="item-detail-section">
        <div class="item-detail-container">
            <a href="browse.html" class="back-link">← Back to Browse</a>
            
            <div class="item-detail">
                <div class="item-detail-image">
                    <img id="itemImage" src="" alt="Item image" style="width: 100%; border-radius: 8px;">
                </div>
                
                <div class="item-detail-info">
                    <p id="itemCategory" class="item-category-badge"></p>
                    <h1 id="itemTitle"></h1>
                    <p id="itemSeller" class="item-seller-detail"></p>
                    <p id="itemDescription" class="item-description-detail"></p>
                    
                    <div class="item-price-detail">
                        <span id="itemPrice" class="price-text"></span>
                    </div>
                    
                    <p id="itemDate" class="item-date"></p>
                    <p id="itemStatus" class="item-status"></p>
                    
                    <button id="buyNowBtn" type="button" class="btn btn-register" style="width: 100%; padding: 15px; margin-top: 20px;">Buy Now</button>
                    
                    <div id="paymentSection" style="margin-top: 30px; padding-top: 30px; border-top: 1px solid #ddd; display: none;">
                        <h3>Payment Details</h3>
                        <div id="savedPaymentInfo" style="margin-bottom: 20px;"></div>
                        <form id="purchasePaymentForm" style="display: none;">
                            <div class="form-group">
                                <label for="purchaseCardHolder">Card Holder Name:</label>
                                <input type="text" id="purchaseCardHolder" required>
                            </div>
                            <div class="form-group">
                                <label for="purchaseCardNumber">Card Number:</label>
                                <input type="text" id="purchaseCardNumber" placeholder="1234 5678 9012 3456" required>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <div class="form-group">
                                    <label for="purchaseExpiry">Expiry (MM/YY):</label>
                                    <input type="text" id="purchaseExpiry" required>
                                </div>
                                <div class="form-group">
                                    <label for="purchaseCvv">CVV:</label>
                                    <input type="text" id="purchaseCvv" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-register" style="width: 100%;">Complete Purchase</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="paymentModal" class="payment-modal" style="display: none;">
        <div class="payment-modal-content">
            <div class="payment-header">
                <h2>Payment Gateway</h2>
                <button type="button" class="close-payment-btn">&times;</button>
            </div>
            
            <div class="payment-body">
                <div class="payment-summary">
                    <h3 id="paymentItemTitle"></h3>
                    <p>Total Amount: <strong id="paymentAmount"></strong></p>
                </div>

                <form id="paymentForm">
                    <div class="form-group">
                        <label for="cardName">Cardholder Name:</label>
                        <input type="text" id="cardName" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="cardNumber">Card Number:</label>
                        <input type="text" id="cardNumber" inputmode="numeric" placeholder="1234 5678 9012 3456" maxlength="19" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cardExpiry">Expiry Date:</label>
                            <input type="text" id="cardExpiry" inputmode="numeric" placeholder="MM/YY" maxlength="5" required>
                        </div>
                        <div class="form-group">
                            <label for="cardCVV">CVV:</label>
                            <input type="password" id="cardCVV" inputmode="numeric" placeholder="123" maxlength="3" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="billingZip">Billing Zip Code:</label>
                        <input type="text" id="billingZip" inputmode="numeric" placeholder="12345" required>
                    </div>

                    <p id="paymentError" class="error"></p>

                    <button type="submit" class="btn btn-register" style="width: 100%; padding: 12px; margin-top: 20px;">Complete Payment</button>
                </form>
            </div>
        </div>
    </div>

    <div id="successModal" class="payment-modal" style="display: none;">
        <div class="payment-modal-content success-content">
            <div class="success-body">
                <div class="success-icon">✓</div>
                <h2>Payment Successful!</h2>
                <p class="success-message">Your purchase has been confirmed</p>
                
                <div class="success-details">
                    <div class="detail-row">
                        <span class="detail-label">Item:</span>
                        <span class="detail-value" id="successItemName"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Amount Paid:</span>
                        <span class="detail-value" id="successAmount"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Transaction ID:</span>
                        <span class="detail-value" id="successTransactionId"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Date & Time:</span>
                        <span class="detail-value" id="successDateTime"></span>
                    </div>
                </div>
                
                <p style="margin-top: 20px; color: #666; font-size: 14px;">A confirmation email has been sent to your registered email address.</p>
                
                <button type="button" class="btn btn-register" style="width: 100%; padding: 12px; margin-top: 20px;" onclick="closeSuccessModal()">Continue Shopping</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="item.js"></script>
</body>

</html>
