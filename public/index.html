<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalTrade</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">LocalTrade</div>
        <nav class="nav-menu">
            <a href="browse.html" class="nav-link">Buy</a>
            <a href="sell.html" class="nav-link" id="sellLink" style="display: none;">Sell</a>
        </nav>
        <div class="auth-buttons">
            <div id="signupBtn">
                <a href="signup.html" class="btn btn-register">Sign Up</a>
            </div>
            <div id="userProfile" style="display: none; display: flex; align-items: center; gap: 15px;">
                <span id="username"></span>
                <button id="signoutBtn" class="btn btn-login">Sign Out</button>
            </div>
        </div>
    </header>

    <section class="featured-section">
        <h2 id="categoryTitle"></h2>
        
        <div class="carousel-container">
            <button class="carousel-btn prev" id="prevBtn">❮</button>
            
            <div class="carousel-wrapper">
                <div id="carouselItems" class="carousel-items"></div>
            </div>
            
            <button class="carousel-btn next" id="nextBtn">❯</button>
        </div>
        
        <div class="carousel-dots" id="dotsContainer"></div>
        
        <div style="text-align: center; margin-top: 30px;">
            <a href="browse.html" class="btn btn-register">View All Items</a>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="home.js"></script>
</body>
</html>
