<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalTrade</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">LocalTrade</div>
        <nav class="nav-menu">
            <a href="browse.html" class="nav-link">Buy</a>
            <a href="sell.html" class="nav-link" id="sellLink" style="display: none;">Sell</a>
        </nav>
        <div class="auth-buttons">
            <div id="signupBtn">
                <a href="signup.html" class="btn btn-register">Sign Up</a>
            </div>
            <div id="userProfile" style="display: none; display: flex; align-items: center; gap: 15px;">
                <span id="username"></span>
                <button id="signoutBtn" class="btn btn-login">Sign Out</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Welcome to LocalTrade</h1>
        <p>Buy and sell with your community</p>
        <a href="browse.html" class="btn btn-register" style="padding: 15px 30px; font-size: 16px;">Browse Items</a>
    </section>

    <script src="script.js"></script>
</body>
</html>
