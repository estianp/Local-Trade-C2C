<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2C Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">C2C Platform</div>
        <div class="auth-buttons">
            <div id="signupBtn">
                <a href="signup.html" class="btn btn-register">Sign Up</a>
            </div>
            <div id="userProfile" style="display: none; display: flex; align-items: center; gap: 15px;">
                <span id="username"></span>
                <button id="signoutBtn" class="btn btn-login">Sign Out</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Welcome to C2C Platform</h1>
        <p>Create an account or login to get started</p>
        <a href="signup.html" class="btn btn-register" style="padding: 15px 30px; font-size: 16px;">Get Started</a>
    </section>

    <script src="script.js"></script>
</body>
</html>
