<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - LocalTrade</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">LocalTrade</a></div>
        <nav class="nav-menu">
            <a href="browse.html" class="nav-link">Buy</a>
            <a href="sell.html" class="nav-link" id="sellLink" style="display: none;">Sell</a>
        </nav>
        <div class="auth-buttons">
            <div id="signupBtn">
                <a href="signup.html" class="btn btn-register">Sign Up</a>
            </div>
            <div id="userProfile" style="display: none; display: flex; align-items: center; gap: 15px;">
                <span id="username" style="cursor: pointer; text-decoration: underline;"></span>
                <button id="signoutBtn" class="btn btn-login">Sign Out</button>
            </div>
        </div>
    </header>

    <section class="profile-section">
        <div class="profile-container">
            <div class="profile-tabs">
                <button class="tab-btn active" data-tab="edit-profile">Edit Profile</button>
                <button class="tab-btn" data-tab="shipping-address">Shipping Address</button>
                <button class="tab-btn" data-tab="payment-details">Payment Details</button>
                <button class="tab-btn" data-tab="my-listings">My Listings</button>
                <button class="tab-btn" data-tab="admin-portal" id="adminTabBtn" style="display: none;">
                   Admin Portal
                </button>
            </div>

            <div id="edit-profile" class="tab-content active">
                <h2>Edit Profile</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="editUsername">Username:</label>
                        <input type="text" id="editUsername" required>
                    </div>

                    <div class="form-group">
                        <label for="editEmail">Email:</label>
                        <input type="email" id="editEmail" disabled>
                    </div>

                    <button type="submit" class="btn btn-register">Save Changes</button>
                    <p id="profileError" class="error"></p>
                    <p id="profileSuccess" style="color: green; display: none;"></p>
                </form>
            </div>

            <div id="shipping-address" class="tab-content">
                <h2>Shipping Address</h2>
                <div id="shippingStatus" style="margin-bottom: 20px;"></div>
                <form id="shippingForm">
                    <div class="form-group">
                        <label for="shippingFullName">Full Name:</label>
                        <input type="text" id="shippingFullName" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="shippingPhone">Phone Number:</label>
                        <input type="tel" id="shippingPhone" placeholder="+27 123 456 7890" required>
                    </div>

                    <div class="form-group">
                        <label for="shippingStreet">Street Address:</label>
                        <input type="text" id="shippingStreet" placeholder="123 Main Street" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label for="shippingCity">City:</label>
                            <input type="text" id="shippingCity" placeholder="Cape Town" required>
                        </div>

                        <div class="form-group">
                            <label for="shippingProvince">Province:</label>
                            <input type="text" id="shippingProvince" placeholder="Western Cape" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="shippingPostal">Postal Code:</label>
                        <input type="text" id="shippingPostal" placeholder="8000" required>
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-register">Save Shipping Address</button>
                        <button type="button" class="btn btn-delete" id="deleteShippingBtn" style="display: none;">
                            Delete Address
                        </button>
                    </div>
                    <p id="shippingError" class="error"></p>
                    <p id="shippingSuccess" style="color: green; display: none;"></p>
                </form>
            </div>

            <div id="payment-details" class="tab-content">
                <h2>Payment Details</h2>
                <div id="paymentStatus" style="margin-bottom: 20px;"></div>
                <form id="paymentForm">
                    <div class="form-group">
                        <label for="cardHolderName">Card Holder Name:</label>
                        <input type="text" id="cardHolderName" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="cardNumber">Card Number:</label>
                        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" required maxlength="19">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label for="expiryDate">Expiry Date (MM/YY):</label>
                            <input type="text" id="expiryDate" placeholder="12/25" required maxlength="5">
                        </div>

                        <div class="form-group">
                            <label for="cvv">CVV:</label>
                            <input type="text" id="cvv" placeholder="123" required maxlength="4">
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-register">Save Payment Details</button>
                        <button type="button" class="btn btn-delete" id="deletePaymentBtn" style="display: none;">
                            Delete Payment Details
                        </button>
                    </div>
                    <p id="paymentError" class="error"></p>
                    <p id="paymentSuccess" style="color: green; display: none;"></p>
                </form>
            </div>

            <div id="my-listings" class="tab-content">
                <h2>My Listings</h2>
                <div id="userListingsContainer" class="items-grid"></div>
            </div>

            <div id="admin-portal" class="tab-content">
                <h2>Admin Portal</h2>
                <p>Welcome to the admin dashboard. You can manage users and listings from here.</p>
                <a href="admin.html" class="btn btn-register" style="display: inline-block; margin-top: 20px;">
                    Go to Admin Dashboard
                </a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="profile.js"></script>
    <script src="payment.js"></script>
    <script src="shipping.js"></script>
</body>

</html>
