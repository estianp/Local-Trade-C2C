<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Complete - LocalTrade</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="purchase_complete.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">LocalTrade</a></div>
        <nav class="nav-menu">
            <a href="browse.html" class="nav-link">Buy</a>
            <a href="sell.html" class="nav-link" id="sellLink" style="display: none;">Sell</a>
        </nav>
        <div class="auth-buttons">
            <div id="userProfile" style="display: flex; align-items: center; gap: 15px;">
                <span id="username"></span>
                <button id="signoutBtn" class="btn btn-login">Sign Out</button>
            </div>
        </div>
    </header>

    <section class="purchase-complete-section">
        <div class="purchase-complete-container">
            <!-- Success Message -->
            <div class="success-card">
                <div class="success-icon">✓</div>
                <h1>Purchase Successful!</h1>
                <p>Thank you for your purchase. Your transaction has been completed.</p>
            </div>

            <!-- Order Summary -->
            <div class="order-details-card">
                <h2>Order Details</h2>
                <div class="detail-item">
                    <img id="itemImage" src="" alt="Item" class="detail-image">
                    <div class="detail-info">
                        <h3 id="itemTitle"></h3>
                        <p id="itemCategory" style="color: #666; font-size: 14px;"></p>
                        <p id="itemPrice" style="font-weight: bold; color: #27ae60; font-size: 18px;"></p>
                    </div>
                </div>
            </div>

            <!-- Seller Rating Card -->
            <div class="rating-card">
                <h2>Rate Your Seller</h2>
                <p style="color: #666; margin-bottom: 20px;">How was your experience with this seller?</p>

                <div class="seller-info">
                    <p><strong>Seller:</strong> <span id="sellerName"></span></p>
                </div>

                <form id="ratingForm">
                    <div class="form-group">
                        <label>Rating (1-10):</label>
                        <div id="starRating" class="star-rating">
                            <!-- Stars will be generated by JS -->
                        </div>
                        <input type="hidden" id="rating" value="0">
                    </div>

                    <div class="form-group">
                        <label for="review">Review (Optional):</label>
                        <textarea id="review" placeholder="Share your experience with this seller..." rows="5"></textarea>
                    </div>

                    <div class="rating-actions">
                        <button type="submit" class="btn btn-register" id="submitRating">Submit Rating</button>
                        <a href="browse.html" class="btn btn-login" style="text-align: center;">Skip for Now</a>
                    </div>

                    <p id="ratingError" class="error" style="display: none;"></p>
                    <p id="ratingSuccess" style="color: green; display: none;"></p>
                </form>

                <!-- Already Rated Message -->
                <div id="alreadyRatedMessage" style="display: none; text-align: center; padding: 20px;">
                    <p style="color: #27ae60; font-size: 16px;">✓ You have already rated this seller</p>
                    <a href="browse.html" class="btn btn-register" style="display: inline-block; margin-top: 15px;">Continue Shopping</a>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="purchase_complete.js"></script>
</body>
</html>
