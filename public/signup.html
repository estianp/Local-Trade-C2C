<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - LocalTrade</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
    <header>
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">LocalTrade</a></div>
        <nav class="nav-menu">
            <a href="browse.html" class="nav-link">Buy</a>
            <a href="sell.html" class="nav-link" id="sellLink" style="display: none;">Sell</a>
        </nav>
        <div class="auth-buttons">
            <div id="signupBtn">
                <a href="signup.html" class="btn btn-register">Sign Up</a>
            </div>
            <div id="userProfile" style="display: none; display: flex; align-items: center; gap: 15px;">
                <span id="username"></span>
                <button id="signoutBtn" class="btn btn-login">Sign Out</button>
            </div>
        </div>
    </header>

    <div class="signup-container">
        <div class="signup-box">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            <div id="login" class="tab-content active">
                <h2>Login</h2>
                <form id="loginForm">
                    <input type="text" placeholder="Username" id="loginUsername" required>
                    <input type="password" placeholder="Password" id="loginPassword" required>

                    <!-- Turnstile Captcha for Login - Centered -->
                    <div style="display: flex; justify-content: center; margin: 20px 0;">
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAADbG5H168FkEmQ8i" data-theme="light"></div>
                    </div>

                    <button type="submit" class="btn btn-register" style="width: 100%;">Login</button>
                </form>
                <p id="loginError" class="error"></p>
            </div>

            <div id="register" class="tab-content">
                <h2>Register</h2>
                <form id="registerForm">
                    <input type="text" placeholder="Username" id="registerUsername" required>
                    <input type="email" placeholder="Email" id="registerEmail" required>
                    <input type="password" placeholder="Password" id="registerPassword" required>

                    <!-- Turnstile Captcha for Register - Centered -->
                    <div style="display: flex; justify-content: center; margin: 20px 0;">
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAADbG5H168FkEmQ8i" data-theme="light"></div>
                    </div>

                    <button type="submit" class="btn btn-register" style="width: 100%;">Register</button>
                </form>
                <p id="registerError" class="error"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="turnstile.js"></script>
</body>

</html>
